name: NOCAM Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nocam-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Branding and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image processing dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate NOCAM branding assets
        run: python tools/generate_brand_assets.py

      - name: Verify generated assets
        run: |
          test -f app/src/main/res/drawable-nodpi/nocam_logo.png
          test -f app/src/main/res/drawable-nodpi/nocam_splash.png
          test -f app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f Assets/nocam_feature_graphic.png
          echo "All required NOCAM branding assets exist."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            find app/build/outputs -type f || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOCAM-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated branding assets
        uses: actions/upload-artifact@v4
        with:
          name: NOCAM-brand-assets
          path: |
            app/src/main/res/drawable-nodpi/nocam_logo.png
            app/src/main/res/drawable-nodpi/nocam_splash.png
            app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
            app/src/main/res/mipmap-*
            app/src/main/res/values/ic_launcher_background.xml
            Assets/nocam_feature_graphic.png
          if-no-files-found: error
          retention-days: 14