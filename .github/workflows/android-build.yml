
name: NOCAM Android APK Builder

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nocam-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NOCAM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate NOCAM branding
        run: |
          python tools/generate_brand_assets.py

      - name: Verify NOCAM logo
        run: |
          test -f app/src/main/res/drawable-nodpi/nocam_logo.png
          echo "NOCAM logo verified."

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f app/settings.gradle ] || [ -f app/settings.gradle.kts ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          else
            echo "Android project settings file not found."
            exit 1
          fi

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2
          fi

          chmod +x gradlew

          # Force the compatible Gradle version
          sed -i 's/gradle-[0-9.]*-\(bin\|all\)\.zip/gradle-8.10.2-bin.zip/' \
            gradle/wrapper/gradle-wrapper.properties

          cat gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NOCAM APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew --version
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload NOCAM APK
        uses: actions/upload-artifact@v4
        with:
          name: NOCAM-Android-APK
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload branding assets
        uses: actions/upload-artifact@v4
        with:
          name: NOCAM-Branding-Assets
          path: |
            app/src/main/res/drawable-nodpi/nocam_logo.png
            app/src/main/res/drawable/ic_launcher_foreground.png
          if-no-files-found: warn
          retention-days: 30
