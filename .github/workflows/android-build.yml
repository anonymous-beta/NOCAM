
name: NOCAM Android APK Builder

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nocam-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NOCAM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate NOCAM branding
        run: |
          if [ -f tools/generate_brand_assets.py ]; then
            python tools/generate_brand_assets.py
          else
            echo "Brand generator not found."
            exit 1
          fi

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f app/settings.gradle ] || [ -f app/settings.gradle.kts ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Android Gradle project not found."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

      - name: Verify NOCAM logo
        run: |
          test -f app/src/main/res/drawable-nodpi/nocam_logo.png
          echo "NOCAM logo generated."

      - name: Generate Gradle wrapper if missing
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper missing. Generating it..."

            if [ -f build.gradle.kts ]; then
              GRADLE_VERSION=$(grep -oE 'gradle:[0-9]+\.[0-9]+(\.[0-9]+)?' build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?$' || true)
            else
              GRADLE_VERSION=""
            fi

            GRADLE_VERSION="${GRADLE_VERSION:-8.9}"

            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

          if [ ! -f gradlew ]; then
            echo "ERROR: Could not generate Gradle wrapper."
            exit 1
          fi

          chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NOCAM debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"
          echo "$APK" > apk-path.txt

      - name: Upload NOCAM APK
        uses: actions/upload-artifact@v4
        with:
          name: NOCAM-Android-APK
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload NOCAM branding
        uses: actions/upload-artifact@v4
        with:
          name: NOCAM-Branding-Assets
          path: |
            app/src/main/res/drawable-nodpi/nocam_logo.png
            app/src/main/res/drawable/ic_launcher_foreground.png
          if-no-files-found: warn
          retention-days: 30
