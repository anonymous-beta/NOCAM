
name: NOCAM Android APK Builder

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nocam-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NOCAM APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout NOCAM
        uses: actions/checkout@v4

      # 2. Java setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      # 5. Generate NOCAM branding
      - name: Generate NOCAM branding
        run: |
          if [ ! -f tools/generate_brand_assets.py ]; then
            echo "ERROR: Branding generator not found."
            exit 1
          fi

          python tools/generate_brand_assets.py

      # 6. Verify logo
      - name: Verify NOCAM logo
        run: |
          test -f app/src/main/res/drawable-nodpi/nocam_logo.png
          echo "NOCAM logo verified."

      # 7. Locate Android project
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f app/settings.gradle ] || [ -f app/settings.gradle.kts ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Android project settings not found."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

      # 8. Validate Android Manifest XML
      - name: Validate Android Manifest
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"

          try:
              ET.parse(path)
              print("AndroidManifest.xml is valid XML.")
          except (ET.ParseError, FileNotFoundError) as error:
              print(f"MANIFEST ERROR: {error}")
              raise
          PY

      # 9. Generate Gradle wrapper if missing
      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.10.2
          fi

          chmod +x gradlew

          sed -i 's#gradle-[0-9.]*-\(bin\|all\)\.zip#gradle-8.10.2-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper prepared."

      # 10. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 11. Confirm Gradle version
      - name: Verify Gradle version
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --version

      # 12. Build APK
      - name: Build NOCAM APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew --no-daemon clean assembleDebug

      # 13. Verify APK
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK=$(find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload NOCAM APK
        uses: actions/upload-artifact@v4
        with:
          name: NOCAM-Android-APK
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 15. Upload branding assets
      - name: Upload NOCAM branding
        uses: actions/upload-artifact@v4
        with:
          name: NOCAM-Branding-Assets
          path: |
            app/src/main/res/drawable-nodpi/nocam_logo.png
            app/src/main/res/drawable/ic_launcher_foreground.png
          if-no-files-found: warn
          retention-days: 30
