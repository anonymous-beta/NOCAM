name: NOCAM Android APK Builder

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nocam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NOCAM APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout NOCAM source
        uses: actions/checkout@v4

      # 2. Set up Java for Android Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Install image generation dependency
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      # 5. Generate NOCAM branding assets
      - name: Generate NOCAM branding
        run: |
          python tools/generate_brand_assets.py

      # 6. Verify generated logo
      - name: Verify NOCAM logo
        run: |
          test -f app/src/main/res/drawable-nodpi/nocam_logo.png
          echo "NOCAM logo successfully generated."

      # 7. Verify Android project
      - name: Verify Gradle wrapper
        run: |
          test -f gradlew
          chmod +x gradlew

      # 8. Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 9. Build debug APK
      - name: Build NOCAM APK
        run: |
          ./gradlew --no-daemon clean assembleDebug

      # 10. Verify APK
      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 11. Upload APK artifact
      - name: Upload NOCAM APK
        uses: actions/upload-artifact@v4
        with:
          name: NOCAM-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 12. Upload generated branding assets for inspection
      - name: Upload NOCAM branding assets
        uses: actions/upload-artifact@v4
        with:
          name: NOCAM-Branding-Assets
          path: |
            app/src/main/res/drawable-nodpi/nocam_logo.png
            app/src/main/res/drawable/ic_launcher_foreground.png
          if-no-files-found: warn
          retention-days: 30